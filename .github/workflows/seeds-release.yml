name: seed-corpus-release
on:
  push:
    tags: ["seeds-[0-9]+.[0-9]+.[0-9]+.[0-9]+"]
permissions: {contents: read}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: {contents: write, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install .
      - run: |
          version="${GITHUB_REF_NAME#seeds-}"
          # The tag names the release, so the tag writes the version file too.
          # Copied across unchanged it carried whatever the last human bump
          # said, and a corpus that misreports its own version reads as older
          # than it is -- the project installs it and goes on running the
          # seeds it already had.
          python - "$version" <<'VERSION'
          import json, pathlib, sys
          path = pathlib.Path("corpus-version.json")
          document = json.loads(path.read_text())
          document["version"] = sys.argv[1]
          path.write_text(json.dumps(document, indent=2) + "\n")
          VERSION
          moonshiner seeds manifest --seeds tasks/seeds --version "$version" --output MANIFEST.json
          moonshiner seeds catalog --seeds tasks/seeds --output SEED_CATALOG.md
          moonshiner seeds catalog --seeds tasks/seeds --json --output SEED_CATALOG.json
          mkdir -p "moonshiner-seeds-$version/tasks"
          cp MANIFEST.json corpus-version.json SEED_CATALOG.md SEED_CATALOG.json "moonshiner-seeds-$version/"
          cp -a tasks/seeds "moonshiner-seeds-$version/tasks/"
          cp tasks/behavior-worlds.json "moonshiner-seeds-$version/tasks/"
          tar -czf "moonshiner-seeds-$version.tar.gz" "moonshiner-seeds-$version"
          sha256sum "moonshiner-seeds-$version.tar.gz" > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with: {subject-path: "moonshiner-seeds-*.tar.gz"}
      - run: gh release create "$GITHUB_REF_NAME" moonshiner-seeds-*.tar.gz SHA256SUMS --verify-tag --generate-notes
        env: {GH_TOKEN: "${{ github.token }}"}
